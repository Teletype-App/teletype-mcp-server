# Smithery configuration for Teletype MCP Server
# Legacy stdio configuration. Current publishing uses the MCPB bundle.
# See https://smithery.ai/docs/build/publish

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - teletypeApiToken
    properties:
      teletypeApiToken:
        type: string
        description: Teletype Public API Token from your Teletype project settings
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', 'teletype-mcp-server@0.1.2', '--stdio'],
      env: {
        TELETYPE_API_TOKEN: config.teletypeApiToken
      }
    })
