name: Publish MCP Registry

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose npm version is published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Teletype-App/teletype-mcp-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must be a version tag, for example v0.1.1." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify release metadata
        run: GITHUB_REF_NAME="$RELEASE_TAG" npm run release:verify
      - name: Wait for the npm version
        run: |
          PACKAGE_SPEC="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          for attempt in {1..12}; do
            echo "Checking npm publication, attempt $attempt/12."
            if [[ "$(npm view "$PACKAGE_SPEC" version 2>/dev/null)" == "$EXPECTED_VERSION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "The npm version must be available before Registry publication." >&2
          exit 1
      - name: Install verified mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          ARCHIVE="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$PUBLISHER_SHA256" "$ARCHIVE" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Authenticate with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish the prepared server metadata
        run: mcp-publisher publish
